name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK to ToDus S3
        run: |
          curl -X PUT \
            --fail \
            --show-error \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Content-Disposition: inline; filename=\"seend.apk\"" \
            --upload-file app/build/outputs/apk/release/app-release.apk \
            "https://s3.todus.cu/stream/seend/seend.apk"
          echo "APK subido a: https://s3.todus.cu/stream/seend/seend.apk"
          echo "### APK URL: https://s3.todus.cu/stream/seend/seend.apk" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seend-release-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
