name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK to Uguu
        run: |
          URL=$(curl -s -F "files[]=@app/build/outputs/apk/release/app-release.apk" https://uguu.se/upload | grep -oP '"url":"[^"]+"' | cut -d'"' -f4)
          echo "APK subido a: $URL"
          echo "$URL" > apk_url.txt
          echo "### APK URL: $URL" >> $GITHUB_STEP_SUMMARY

      - name: Show APK URL
        run: cat apk_url.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seend-release-${{ github.run_id }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: error
